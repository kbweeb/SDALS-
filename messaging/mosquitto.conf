# Mosquitto MQTT broker - messaging layer
# Routes telemetry from Zigbee2MQTT to the backend and commands from the backend back to Zigbee2MQTT.

listener 1883
# Prototype only: anonymous access on the local machine.
# Before real use, set allow_anonymous false and add a password_file.
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
