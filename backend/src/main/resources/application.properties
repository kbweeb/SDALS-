spring.application.name=smart-door-backend
server.port=8080

# --- Database layer (see ../database) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smartdoor}
spring.datasource.username=${DB_USER:smartdoor}
spring.datasource.password=${DB_PASSWORD:smartdoor}
# Schema is owned by database/init/*.sql; Hibernate only checks it matches.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Messaging layer (see ../messaging and ../zigbee2mqtt) ---
mqtt.broker-url=${MQTT_URL:tcp://localhost:1883}
mqtt.client-id=smart-door-backend
mqtt.username=${MQTT_USER:}
mqtt.password=${MQTT_PASSWORD:}
mqtt.state-topic=zigbee2mqtt/smart_lock
mqtt.command-topic=zigbee2mqtt/smart_lock/set

# --- Security ---
# Override JWT_SECRET outside development (min 32 characters).
security.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
security.jwt.ttl-minutes=60
app.bootstrap-admin.username=${ADMIN_USER:admin}
app.bootstrap-admin.password=${ADMIN_PASSWORD:admin123}

management.endpoints.web.exposure.include=health
